<section class="stats">
  <div class="container stats__grid">
    <div class="stats__card">
      <span class="stats__value"><span arkaCounter [target]="99.9" [decimals]="1" suffix="%">0%</span></span>
      <span class="stats__label">Fleet &amp; service reliability target</span>
      <span class="stats__badge">Target</span>
    </div>

    <div class="stats__card">
      <span class="stats__value"><span arkaCounter [target]="24" [decimals]="0" suffix="/7">0/7</span></span>
      <span class="stats__label">Customer Support</span>
    </div>

    <div class="stats__card">
      <span class="stats__value stats__value--text">Pan India</span>
      <span class="stats__label">Coverage Vision</span>
      <span class="stats__badge">Vision</span>
    </div>

    <div class="stats__card">
      <span class="stats__value stats__value--text">EV First</span>
      <span class="stats__label">Sustainable Mobility</span>
      <span class="stats__badge">Goal</span>
    </div>
  </div>
</section>
