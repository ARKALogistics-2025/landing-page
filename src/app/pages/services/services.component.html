<section class="page-banner">
  <div class="container">
    <span class="eyebrow">What We Do</span>
    <h1>Our Logistics Solutions</h1>
    <p>End-to-end transportation services engineered for enterprise, e-commerce and corporate clients across India.</p>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="grid-auto">
      @for (service of services; track service.title) {

      }
    </div>

</section>

<arka-cta

></arka-cta>
